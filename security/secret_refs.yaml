# Where every secret lives. NOTHING in this file is a secret: it holds references and rules, never values.
# security/resolve_secrets.py reads it at boot and fails closed (exit 1) when a required secret is missing,
# too short, or still a placeholder.
#
# Path taken this week (declared in the README): NO live Azure Key Vault and NO AWS account.
#   - values arrive by environment injection (docker compose ${VAR}, CI secrets, or a .env that git ignores)
#     or as files under /run/secrets/ (Docker secrets / the Key Vault CSI driver mount the same way);
#   - the azure_key_vault and aws columns name the objects a real deployment would create. They are the
#     design, written as configuration; security/kms_twin.json describes the keys that protect them.
version: 1
vault:
  azure_key_vault: https://afyaplus-kv.vault.azure.net     # planned; also in config/partners.yaml
  aws_secrets_manager_region: af-south-1                  # Cape Town, the nearest AWS region to Kenya
  file_mount: /run/secrets                                 # Docker secrets / CSI driver mount point

secrets:
  JWT_SECRET:
    purpose: HS256 signing key for API bearer tokens (Week 6 auth)
    required_by: [api]
    min_length: 32
    azure_key_vault: {secret: jwt-signing-key}
    aws: {secrets_manager: afyaplus/jwt-signing-key, kms_key: alias/afyaplus-secrets}
    rotate_every_days: 90
    rotation_note: Rotating logs everyone out (tokens live 30 minutes); roll it in a quiet window.

  AUDIT_HASH_KEY:
    purpose: HMAC-SHA256 key that hashes redacted payloads in logs/audit.jsonl (redact_then_hash.py)
    required_by: [api, mcp]
    min_length: 32
    azure_key_vault: {secret: audit-hash-key}
    aws: {secrets_manager: afyaplus/audit-hash-key, kms_key: alias/afyaplus-secrets}
    rotate_every_days: 365
    rotation_note: Each audit line records hash_key_id, so lines hashed under an old key stay verifiable.

  OPENAI_API_KEY:
    purpose: Live triage model. Only needed when MODEL_BACKEND=openai.
    required_by: [api]
    required_when: {MODEL_BACKEND: openai}
    min_length: 20
    azure_key_vault: {secret: openai-api-key}
    aws: {secrets_manager: afyaplus/openai-api-key, kms_key: alias/afyaplus-secrets}
    rotate_every_days: 90
    rotation_note: Create the new key in the OpenAI console, swap it in the vault, then revoke the old one.

  AUDIT_KEK:
    purpose: Local stand-in for the KMS key that wraps per-file data keys (security/encrypt_at_rest.py)
    required_by: [archive]
    min_length: 44                    # base64 of 32 random bytes
    azure_key_vault: {key: afyaplus-archive-kek, type: RSA-HSM 3072, note: wrap/unwrap only, never exported}
    aws: {kms_key: alias/afyaplus-archive, key_spec: SYMMETRIC_DEFAULT, note: GenerateDataKey + Decrypt only}
    rotate_every_days: 365
    rotation_note: >-
      In a real KMS the key never leaves the HSM and rotation keeps old versions for unwrap. Locally the
      archive header records kek_id, so rotate by adding a new KEK and re-wrapping data keys, not data.

# Values refused as secrets. "always": the placeholders from .env.example. "outside_dev": the obviously-for-tests
# values used by pytest and CI, accepted only when DEPLOY_ENV=dev.
placeholders:
  always: [change-me, sk-your-key, your-key, replace-me]
  outside_dev: [test-secret, ci-only, teardown-only, pytest, not-a-secret]
