# Staging stand-in: the pipeline's deploy stage (and a laptop) runs this. Nothing here is a secret;
# JWT_SECRET comes from the environment or .env, and the run fails fast without it.
#   IMAGE=afyaplus-triage:1.3.0 docker compose up -d --wait
# compose also reads .env here for these variables: check DEPLOY_ENV (the candidate never serves in dev).
# Rollback, same image, no rebuild:
#   PROMPT_VERSION=1.2.0 docker compose up -d --wait        (all traffic on 1.2.0, canary off)
#   CANDIDATE_PERCENT=0 docker compose up -d --wait         (canary kill switch only)
# Rollback, previous image:
#   IMAGE=afyaplus-triage:1.2.0 docker compose up -d --wait
services:
  triage:
    image: ${IMAGE:-afyaplus-triage:dev}
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (48+ random chars)}
      MODEL_BACKEND: ${MODEL_BACKEND:-replay}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEPLOY_ENV: ${DEPLOY_ENV:-staging}
      PROMPT_VERSION: ${PROMPT_VERSION:-}
      CANDIDATE_PERCENT: ${CANDIDATE_PERCENT:-}
    ports:
      - "${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - triage-logs:/app/logs
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  triage-logs:
